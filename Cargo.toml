[package]
name = "rayvn"
version = "0.1.2"
edition = "2024"
authors = ["Mark Frawley <mfrawley@pm.me>"]
description = "A fast, Maven-compatible build tool in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mfrawley/rayvn"
keywords = ["maven", "build-tool", "java", "pom", "resolver"]
categories = ["development-tools::build-utils", "command-line-utilities"]
exclude = [
    ".githooks",
    "proposals",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "rvn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "gzip"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"
zip = "9.0.5"
