[package]
name = "rayvn"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rvn"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "http2", "gzip"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"
zip = "9.0.5"
